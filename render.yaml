services:
  - type: web
    name: leaderboard-backend
    env: node
    region: oregon # US region for upstream reachability
    plan: free
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: INGEST_TOKEN
        sync: false
      - key: KALSHI_ENABLED
        value: "true"
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: LEADERBOARD_LIMIT
        value: "40"
